# 試合見張り→終了直後にカード生成→Discord配達(9/4 GitHub移行)
# GitHubのcronは大幅遅延・不発があるため発火チャンスを1日5回に分散(9/4夜の実測: 昼便4.5h遅延+夜便不発)。
# concurrencyで同時実行を禁止(=二重配達防止)。postedマーカーで配達済み試合はスキップ。
# 昼便(12時台)は17:15で必ず退出し、夕方以降の便が未配達分を引き取る
name: watch-games
on:
  schedule:
    - cron: '17 3 * * *'   # 12:17 JST 昼便
    - cron: '57 3 * * *'   # 12:57 JST 昼便バックアップ
    - cron: '47 8 * * *'   # 17:47 JST 夜便
    - cron: '27 9 * * *'   # 18:27 JST 夜便バックアップ1
    - cron: '7 10 * * *'   # 19:07 JST 夜便バックアップ2
  workflow_dispatch:
    inputs:
      mmdd:
        description: 'MMDD(省略=今日JST)'
        required: false

permissions:
  contents: write

concurrency:
  group: watch-games
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.p.outputs.games }}
      mmdd: ${{ steps.p.outputs.mmdd }}
      has: ${{ steps.p.outputs.has }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          MMDD: ${{ inputs.mmdd }}
        run: python3 src/cloud_plan.py

  watch:
    needs: plan
    if: needs.plan.outputs.has == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        gid: ${{ fromJSON(needs.plan.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
      - name: 日本語フォント
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 見張り→カード→Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BROWSER_BIN: /usr/bin/google-chrome
          DEADLINE: ${{ (github.event.schedule == '17 3 * * *' || github.event.schedule == '57 3 * * *') && '17:15' || '23:20' }}
        run: python3 src/cloud_watch.py ${{ needs.plan.outputs.mmdd }} ${{ matrix.gid }} --deadline $DEADLINE
