# 週間監督通信簿(9/9フェーズ1・design-weekly 1節)
# 9/10社長裁定: 自動配信は停止(画像商品=毎日の試合カード+打順カードの2枚のみ)。
# 週次画像はCLIで相談しながら作る運用 → 手動dispatch枠のみ残す
name: weekly-tsushinbo
on:
  workflow_dispatch:
    inputs:
      d0:
        description: '開始MMDD(省略=直近の火曜)'
        required: false
      d1:
        description: '終了MMDD(省略=直近の日曜)'
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-tsushinbo
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 日本語フォント
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: numpy
        run: pip install -q numpy
      - name: 週間集計→カード→Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BROWSER_BIN: /usr/bin/google-chrome
        run: python3 src/cloud_weekly.py ${{ inputs.d0 }} ${{ inputs.d1 }}
