# 週間監督通信簿の月曜朝便(9/9フェーズ1・design-weekly 1節)
# watch.ymlと別WF・8:00 JST目安・雨天等で試合が無い週も動く(テキスト通知)
# cron遅延・不発対策でバックアップ便あり。二重配達はweeklyマーカーで防止
name: weekly-tsushinbo
on:
  schedule:
    - cron: '0 23 * * 0'    # 月曜 08:00 JST
    - cron: '40 23 * * 0'   # 月曜 08:40 JST バックアップ
  workflow_dispatch:
    inputs:
      d0:
        description: '開始MMDD(省略=直近の火曜)'
        required: false
      d1:
        description: '終了MMDD(省略=直近の日曜)'
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-tsushinbo
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 日本語フォント
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: numpy
        run: pip install -q numpy
      - name: 週間集計→カード→Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BROWSER_BIN: /usr/bin/google-chrome
        run: python3 src/cloud_weekly.py ${{ inputs.d0 }} ${{ inputs.d1 }}
